<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus sites favoritos</title>
    <style type="text/css">
        * {
            padding: 0px;
            margin: 0px;
            border: none;
            box-sizing: border-box;
        }
        body {
            background-color: lightgray;
        }
        ul {
            width: 700px;
        }
        ul > figure > img {
            height: 100px;
        }
        li {
            background-color: gray;
            list-style-type: none;
            margin-bottom: 10px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <main style="display: flex; flex-direction: column; flex-wrap: nowrap; justify-content: center; align-items: center;">
        <h1>Meus sites favoritos: Wyldner</h1>
        <ul>
            <li><h2>Panini</h2></li>
            <figure>
                <img src="Imgs/panini.png" alt="Panini">
                <figcaption>Logo Panini</figcaption>
            </figure>
            <a href="https://panini.com.br/" target="_blank">Panini</a>     

            <li><h2>Pinterest</h2></li>
            <figure>
                <img src="Imgs/pinterest.png" alt="Pinterest">
                <figcaption>Logo Pinterest</figcaption>
            </figure>
            <a href="https://br.pinterest.com/" target="_blank">Pinterest</a>     

            <li><h2>Netflix</h2></li>
            <figure>
                <img src="Imgs/netflix.png" alt="Netflix">
                <figcaption>Logo Netflix</figcaption>
            </figure>
            <a href="https://www.netflix.com/br/" target="_blank">Netflix</a>     

            <li><h2>YouTube</h2></li>
            <figure>
                <img src="Imgs/Youtube.png" alt="YouTube">
                <figcaption>Logo YouTube</figcaption>
            </figure>
            <a href="https://www.youtube.com/" target="_blank">YouTube</a>     

            <li><h2>Olhar Digital</h2></li>
            <figure>
                <img src="Imgs/olhardigital.png" alt="Olhar Digital">
                <figcaption>Logo Olhar Digital</figcaption>
            </figure>
            <a href="https://olhardigital.com.br/" target="_blank">Olhar Digital</a>
        </ul>
    </main>    
</body>
</html>
